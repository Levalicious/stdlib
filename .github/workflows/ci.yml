name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: stdlib            # this repository beside its dependencies: the workspace layout the mkfiles assume (../libeezo, ...)
      - uses: Levalicious/mk@8b33eaa94d5ae53a70b0f3b2cfd9fb1432f8cc9e
      - uses: Levalicious/mkroot@f7addbfe0a8b91de9ef1e0247453f058e3d3fc3a
      - name: dependencies at the commits deps.lock pins
        run: sh stdlib/ci/deps.sh
      - name: build, dependencies first
        run: for d in libeezo eezo eezoc eezott; do (cd $d && mk) || exit 1; done
      - run: (cd stdlib && mk install)
      - name: every module imports into a program, every tt file type-checks
        run: |
          cd stdlib
          for f in *.eezo; do printf '#import %s\nn := 5;\nn\n' "${f%.eezo}" | ../eezoc/eezoc -f xbcl > /dev/null || exit 1; done
          ../eezott/eezott -c tt/prelude.tt || exit 1
          ../eezott/eezott -c -L tt tt/num.tt || exit 1
          for f in tt/*.tt; do
            case $f in tt/prelude.tt|tt/num.tt) continue;; esac
            ../eezott/eezott -c -L tt -p tt/prelude.tt -p tt/num.tt $f || exit 1
          done
